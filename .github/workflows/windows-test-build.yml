# Portable Windows test zip for the current stack. Not a release.
# Triggered by a push of this branch, or by hand. It does not tag, and it
# does not publish a GitHub release. It also does not launch Meridian, so
# no rotator command is sent.

name: Windows test build

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/qlog-currentcontact-859c

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_mingw
          # qtsvg and qttools ship inside the 6.8.3 base archive. aqt rejects them as module names.
          modules: "qtserialport"
          tools: "tools_mingw1310"
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel
      - name: Stage, deploy, and zip
        id: package
        shell: pwsh
        run: |
          $cmakeText = Get-Content -Raw CMakeLists.txt
          if ($cmakeText -notmatch 'project\(Meridian VERSION ([0-9][^\s\)]*)') {
            throw "CMake project version not found."
          }
          $version = $Matches[1]
          if ($version -ne "1.0.0") {
            throw "Refusing to package: CMake version is $version, expected 1.0.0."
          }
          $short = "${{ github.sha }}".Substring(0, 7)

          cmake --install build --config Release --prefix dist
          # Same plugin set as the release zip.
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw --skip-plugin-types generic --exclude-plugins qgif,qico,qjpeg,qcertonlybackend dist/meridian.exe
          [System.IO.File]::WriteAllText((Join-Path dist "qt.conf"), "[Paths]`nPrefix=.`nPlugins=.`n")

          # Coastlines, DXCC outlines, the prefix table, and the licenses.
          # These are also compiled into the exe. The loose copies are in the zip
          # so the test build shows what it was built from. The full Big CTY
          # prefix file is not vendored; dxcc-names.tsv is the derived table,
          # and LICENSE.CTY is its license.
          New-Item -ItemType Directory -Force (Join-Path dist "data"), (Join-Path dist "licenses") | Out-Null
          Copy-Item data/map110.bin, data/map50.bin, data/zcta.bin, data/dxcc.bin, data/dxcc-names.tsv (Join-Path dist "data")
          Copy-Item LICENSE (Join-Path dist "licenses/GPL-3.0.txt")
          Copy-Item third_party/cty/LICENSE.CTY (Join-Path dist "licenses/LICENSE.CTY")
          Copy-Item third_party/inter/OFL.txt (Join-Path dist "licenses/OFL.txt")

          $checklist = @(
            "Meridian $version test build $short"
            ""
            "Unzip this folder and run meridian.exe. Do not run meridian-mock.exe."
            "meridian.ini is created beside meridian.exe the first time settings are saved."
            "The only filled-in value is grid EM26. No COM port, host, or UDP port is filled in."
            "The password for QRZ is not in that file."
            ""
            "This exe is unsigned. Windows SmartScreen will warn. The Qt and MinGW DLLs in this folder are the runtime. There is no installer."
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path dist "TEST-BUILD.txt"), $checklist + "`n")

          Get-ChildItem -Path dist -Recurse -File -Include meridian.ini,*.bak | Remove-Item -Force
          foreach ($dirName in @("logs", "backups")) {
            $dir = Join-Path dist $dirName
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }

          $zipName = "Meridian-$version-test-$short-win64.zip"
          $zipPath = Join-Path (Get-Location) $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            $root = (Resolve-Path dist).Path
            Get-ChildItem -Path dist -Recurse -Directory | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart('\', '/') -replace '\\', '/'
              if ($rel) { [void]$archive.CreateEntry("$rel/") }
            }
            Get-ChildItem -Path dist -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart('\', '/') -replace '\\', '/'
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $_.FullName, $rel, [System.IO.Compression.CompressionLevel]::Optimal)
            }
          } finally {
            $archive.Dispose()
          }

          $check = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($check.Entries | ForEach-Object { $_.FullName })
          } finally {
            $check.Dispose()
          }
          if ($names -notcontains "meridian.exe") { throw "Zip is missing meridian.exe." }
          foreach ($required in @(
            "data/dxcc.bin", "data/dxcc-names.tsv", "data/map50.bin", "data/map110.bin",
            "licenses/LICENSE.CTY", "licenses/GPL-3.0.txt", "licenses/OFL.txt", "qt.conf")) {
            if ($names -notcontains $required) { throw "Zip is missing $required." }
          }
          $ini = @($names | Where-Object { $_.ToLower().EndsWith(".ini") })
          if ($ini.Count -gt 0) { throw "Zip contains an ini file: $($ini -join ', ')" }

          $bytes = (Get-Item $zipPath).Length
          Write-Host "ZIP $zipName $bytes bytes"
          Write-Host "TOP LEVEL:"
          $names | Where-Object { ($_ -notmatch '/') -or ($_ -match '^[^/]+/$') } | Sort-Object | ForEach-Object { Write-Host $_ }

          "zip=$zipName" >> $env:GITHUB_OUTPUT
          "shortsha=$short" >> $env:GITHUB_OUTPUT
          "bytes=$bytes" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-1.0.0-test-${{ steps.package.outputs.shortsha }}-win64
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          compression-level: 0
