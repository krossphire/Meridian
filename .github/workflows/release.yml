name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_mingw
          # qtsvg and qttools ship inside the 6.8.3 base archive. aqt rejects them as module names.
          modules: "qtserialport"
          tools: "tools_mingw1310"
      - name: Build
        shell: pwsh
        run: |
          # MinGW, same family as the alpha zips (libstdc++, not the MSVC runtime).
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel
      - name: Stage, deploy, and zip
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Tag '$tag' has no version." }
          $cmakeText = Get-Content -Raw CMakeLists.txt
          if ($cmakeText -notmatch 'project\(Meridian VERSION ([0-9][^\s\)]*)') {
            throw "CMake project version not found."
          }
          $cmakeVersion = $Matches[1]
          if ($cmakeVersion -ne $version) {
            throw "Tag version $version does not match CMake project version $cmakeVersion."
          }

          cmake --install build --config Release --prefix dist
          # Plugin set matches the alpha zips: qwindows, qsvg, qsvgicon, qschannelbackend,
          # qnetworklistmanager, qmodernwindowsstyle. No software rasterizer, no D3D compiler.
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw --skip-plugin-types generic --exclude-plugins qgif,qico,qjpeg,qcertonlybackend dist/meridian.exe
          [System.IO.File]::WriteAllText((Join-Path dist "qt.conf"), "[Paths]`nPrefix=.`nPlugins=.`n")
          Get-ChildItem -Path dist -Recurse -File -Include meridian.ini,*.bak | Remove-Item -Force
          foreach ($dirName in @("logs", "backups")) {
            $dir = Join-Path dist $dirName
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }

          $zipName = "Meridian-$version-win64.zip"
          $zipPath = Join-Path (Get-Location) $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            $root = (Resolve-Path dist).Path
            Get-ChildItem -Path dist -Recurse -Directory | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart('\', '/') -replace '\\', '/'
              if ($rel) { [void]$archive.CreateEntry("$rel/") }
            }
            Get-ChildItem -Path dist -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart('\', '/') -replace '\\', '/'
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $_.FullName, $rel, [System.IO.Compression.CompressionLevel]::Optimal)
            }
          } finally {
            $archive.Dispose()
          }

          $check = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($check.Entries | ForEach-Object { $_.FullName })
          } finally {
            $check.Dispose()
          }
          if ($names -notcontains "meridian.exe") { throw "Zip is missing meridian.exe." }
          $ini = @($names | Where-Object { $_.ToLower().EndsWith(".ini") })
          if ($ini.Count -gt 0) { throw "Zip contains an ini file: $($ini -join ', ')" }

          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          $sumName = "$zipName.sha256"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $sumName), "$hash  $zipName`n")
          "zip=$zipName" >> $env:GITHUB_OUTPUT
          "sum=$sumName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Meridian ${{ steps.package.outputs.version }}
          body: |
            Portable Windows build. Unzip anywhere and run meridian.exe.

            Settings are written to meridian.ini next to the program. This zip does not include meridian.ini, and Meridian does not use the registry.

            The `.sha256` file is the SHA-256 of the zip (`sha256sum -c` format).
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sum }}
          fail_on_unmatched_files: true
